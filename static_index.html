<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f5f0e8"/>
<title>青崖雪 · 阅读</title>
<style>
:root {
  --bg: #f5f0e8;
  --card: #fffdf8;
  --ink: #2b2b2b;
  --sub: #8a8178;
  --line: #e3dbce;
  --accent: #8c6a4f;
  --accent-soft: #efe5d8;
}
body.night {
  --bg: #171512;
  --card: #201d19;
  --ink: #cfc6b8;
  --sub: #7d7568;
  --line: #342f28;
  --accent: #c9a97f;
  --accent-soft: #2b251d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC",
               "SimSun", "PingFang SC", serif;
  transition: background .3s, color .3s;
}
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.topbar h1 {
  margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 2px;
}
.tools { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 8px; min-width: 34px; height: 34px; font-size: 15px;
  cursor: pointer; padding: 0 8px;
}
.icon-btn:active { background: var(--accent-soft); }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.book-meta { color: var(--sub); font-size: 13px; margin: 4px 4px 16px; }
.chapter-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 14px; margin-bottom: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  cursor: pointer; text-decoration: none; color: var(--ink);
}
.chapter-item:active { background: var(--accent-soft); }
.chapter-item .t { font-size: 16px; }
.chapter-item .meta { font-size: 12px; color: var(--sub); margin-top: 4px; }
.chapter-item .done { color: var(--accent); margin-left: 8px; flex: none; }
.tip {
  color: var(--sub); font-size: 12px; text-align: center; margin: 22px 8px;
  line-height: 1.7;
}
.epub-link {
  display: block; text-align: center; margin: 10px 0 30px;
  color: var(--accent); font-size: 14px; text-decoration: none;
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  background: var(--card);
}
.reader { display: none; }
.reader.show { display: block; }
.reader h2 {
  font-size: 22px; text-align: center; font-weight: 600;
  margin: 8px 0 22px; letter-spacing: 2px;
}
.reader p {
  text-indent: 2em; line-height: 2; margin: 0 0 0.65em;
  font-size: 18px; word-break: break-word;
}
.reader .nav {
  display: flex; gap: 10px; margin: 34px 0 24px;
}
.reader .nav button {
  flex: 1; padding: 13px 0; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 15px; cursor: pointer;
}
.reader .nav button:disabled { opacity: .35; }
.back-link {
  display: inline-block; margin: 0 0 18px; color: var(--accent);
  font-size: 14px; text-decoration: none;
}
.loading { color: var(--sub); text-align: center; padding: 60px 0; font-size: 15px; }
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(80px);
  background: var(--accent); color: #fff; font-size: 14px;
  padding: 11px 20px; border-radius: 24px; z-index: 99;
  transition: transform .35s ease; box-shadow: 0 6px 18px rgba(0,0,0,.18);
  max-width: 92vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="topbar">
  <h1>青崖雪</h1>
  <div class="tools">
    <button class="icon-btn" id="fontMinus" title="减小字号">A−</button>
    <button class="icon-btn" id="fontPlus" title="增大字号">A+</button>
    <button class="icon-btn" id="nightBtn" title="夜间模式">☾</button>
  </div>
</div>

<div class="wrap">
  <div id="listView">
    <div class="book-meta" id="bookMeta">正在加载…</div>
    <div id="chapterList"><div class="loading">加载中…</div></div>
    <a class="epub-link" id="epubLink" href="#" download="青崖雪.epub">下载 EPUB 版</a>
    <div class="tip">我每次发布新章节后，刷新本页就能看到最新内容。<br/>阅读进度会自动保存在这台手机浏览器里。</div>
  </div>

  <div class="reader" id="readerView">
    <a class="back-link" href="#" id="backLink">← 返回目录</a>
    <h2 id="readerTitle"></h2>
    <div id="readerBody"></div>
    <div class="nav">
      <button id="prevBtn">上一章</button>
      <button id="nextBtn">下一章</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var KEY_PREFIX = "qys.progress.";
  var KEY_CURRENT = "qys.current";
  var KEY_FONT = "qys.fontSize";
  var KEY_NIGHT = "qys.night";

  var chapters = [];
  var currentFile = null;
  var fontSize = parseInt(localStorage.getItem(KEY_FONT), 10) || 18;
  var night = localStorage.getItem(KEY_NIGHT) === "1";

  var $ = function (id) { return document.getElementById(id); };
  var listView = $("listView"), readerView = $("readerView");

  function applyFont() {
    fontSize = Math.min(26, Math.max(14, fontSize));
    localStorage.setItem(KEY_FONT, String(fontSize));
    document.querySelectorAll("#readerBody p").forEach(function (p) {
      p.style.fontSize = fontSize + "px";
    });
  }

  function applyNight() {
    document.body.classList.toggle("night", night);
    localStorage.setItem(KEY_NIGHT, night ? "1" : "0");
    $("nightBtn").textContent = night ? "☀" : "☾";
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function renderList() {
    var box = $("chapterList");
    if (!chapters.length) {
      box.innerHTML = '<div class="loading">还没有章节</div>';
      return;
    }
    $("bookMeta").textContent = "共 " + chapters.length + " 章 · 约 "
      + Math.round(chapters.reduce(function (s, c) { return s + c.chars; }, 0) / 1000)
      + " 万字";
    box.innerHTML = "";
    chapters.forEach(function (c, idx) {
      var a = document.createElement("a");
      a.className = "chapter-item";
      a.href = "#";
      a.setAttribute("data-file", c.file);
      var inner = '<div><div class="t">' + c.title + '</div>'
        + '<div class="meta">约 ' + c.chars + ' 字</div></div>';
      if (localStorage.getItem(KEY_PREFIX + c.file)) inner += '<span class="done">✓</span>';
      a.innerHTML = inner;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        openChapter(c.file, idx);
      });
      box.appendChild(a);
    });
  }

  function openChapter(file, idx) {
    currentFile = file;
    localStorage.setItem(KEY_CURRENT, file);
    listView.style.display = "none";
    readerView.classList.add("show");
    $("readerBody").innerHTML = '<div class="loading">加载中…</div>';
    fetch("chapters/" + file).then(function (r) {
      if (!r.ok) throw new Error();
      return r.text();
    }).then(function (html) {
      var tmp = document.createElement("div");
      tmp.innerHTML = html;
      var h1 = tmp.querySelector("h1");
      var title = h1 ? h1.textContent.trim() : chapters[idx].title;
      var paras = [];
      tmp.querySelectorAll("p").forEach(function (p) { paras.push(p.textContent.trim()); });
      $("readerTitle").textContent = title;
      var body = $("readerBody");
      body.innerHTML = "";
      paras.forEach(function (p, i) {
        var el = document.createElement("p");
        el.id = "p" + i;
        el.textContent = p;
        el.style.fontSize = fontSize + "px";
        body.appendChild(el);
      });
      var saved = parseInt(localStorage.getItem(KEY_PREFIX + file), 10);
      if (!isNaN(saved) && document.getElementById("p" + saved)) {
        document.getElementById("p" + saved).scrollIntoView();
      }
      window.scrollTo(0, 0);
      updateNav();
    }).catch(function () {
      $("readerBody").innerHTML = '<div class="loading">加载失败，请检查网络后刷新</div>';
    });
  }

  function saveProgress() {
    if (!currentFile) return;
    var paras = document.querySelectorAll("#readerBody p");
    var mid = window.scrollY + window.innerHeight * 0.35;
    var idx = 0;
    for (var i = 0; i < paras.length; i++) {
      if (paras[i].offsetTop <= mid) idx = i;
      else break;
    }
    localStorage.setItem(KEY_PREFIX + currentFile, String(idx));
  }

  function updateNav() {
    if (!currentFile || !chapters.length) return;
    var idx = chapters.findIndex(function (c) { return c.file === currentFile; });
    $("prevBtn").disabled = idx <= 0;
    $("nextBtn").disabled = idx < 0 || idx >= chapters.length - 1;
  }

  function go(delta) {
    var idx = chapters.findIndex(function (c) { return c.file === currentFile; });
    if (idx < 0) return;
    var next = idx + delta;
    if (next < 0 || next >= chapters.length) return;
    saveProgress();
    openChapter(chapters[next].file, next);
  }

  function goBack() {
    saveProgress();
    readerView.classList.remove("show");
    listView.style.display = "";
    currentFile = null;
    window.scrollTo(0, 0);
  }

  function load() {
    fetch("chapters.json?v=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error();
      return r.json();
    }).then(function (data) {
      chapters = data;
      renderList();
      var last = localStorage.getItem(KEY_CURRENT);
      if (last) {
        var idx = chapters.findIndex(function (c) { return c.file === last; });
        if (idx >= 0) openChapter(last, idx);
      }
    }).catch(function () {
      $("bookMeta").textContent = "加载失败，请检查网络后刷新";
      $("chapterList").innerHTML = '<div class="loading">加载失败</div>';
    });
  }

  function init() {
    applyNight();
    applyFont();
    $("fontMinus").addEventListener("click", function () { fontSize -= 1; applyFont(); });
    $("fontPlus").addEventListener("click", function () { fontSize += 1; applyFont(); });
    $("nightBtn").addEventListener("click", function () { night = !night; applyNight(); });
    $("backLink").addEventListener("click", function (e) { e.preventDefault(); goBack(); });
    $("prevBtn").addEventListener("click", function () { go(-1); });
    $("nextBtn").addEventListener("click", function () { go(1); });
    window.addEventListener("scroll", function () {
      clearTimeout(window._scrollTimer);
      window._scrollTimer = setTimeout(saveProgress, 400);
    }, { passive: true });
    load();
  }

  init();
})();
</script>
</body>
</html>
